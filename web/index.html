<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchday Live</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#14171a;--dim:#6b7280;--line:#e5e7eb;--live:#d92d20;--goal:#079455;--accent:#2563eb;--yellow:#eab308;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--fg:#e8eaed;--dim:#9aa0a6;--line:#262a33;--live:#ff5a4f;--goal:#34d399;--accent:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700}
h1 span{color:var(--live)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:transparent;color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#upd{margin-left:auto;color:var(--dim);font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
.league{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.league h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
.m{display:grid;grid-template-columns:64px 1fr auto 1fr;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.st{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.st.live{color:var(--live);font-weight:700}
.st.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.h{text-align:right}
.sc{font-weight:800;font-size:17px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.ev{grid-column:2/5;font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:12px}
.ev div{flex:1}.ev div:first-child{text-align:right}
.rc{display:inline-block;width:8px;height:11px;background:var(--red);border-radius:1px;margin:0 3px;vertical-align:-1px}
.empty{color:var(--dim);text-align:center;padding:40px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--dim);font-size:12px;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums}
select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.feed div{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.feed time{color:var(--dim);font-size:12px;margin-right:8px}
@media (max-width:560px){.m{grid-template-columns:52px 1fr auto 1fr;padding:10px}.sc{min-width:44px}}
</style>
</head>
<body>
<header>
  <h1>Matchday <span>●</span> Live</h1>
  <nav>
    <button data-v="live" class="on">Live</button>
    <button data-v="today">Today</button>
    <button data-v="feed">Feed</button>
    <button data-v="porra">Predictions</button>
    <button data-v="status">Status</button>
  </nav>
  <div id="upd"></div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const q = (p) => p + (p.includes('?') ? '&' : '?') + (TOKEN ? 'token=' + encodeURIComponent(TOKEN) : '');
let view = 'live', timer = null, porraChan = '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = t => new Date(t * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

async function get(p){ const r = await fetch(q(p)); if(!r.ok) throw new Error(r.status); return r.json(); }

function status(m){
  if (m.state === 'in') return `<span class="st live">${esc(m.minute || m.detail || 'LIVE')}</span>`;
  if (m.state === 'pre') return `<span class="st">${hm(m.start)}</span>`;
  return `<span class="st">${esc(m.detail || 'FT')}</span>`;
}
function reds(n){ return '<span class="rc"></span>'.repeat(n || 0); }
function evs(m, side){
  return m.events.filter(e => e.side === side && ['goal','pen','og','red','yred'].includes(e.type))
    .map(e => (['red','yred'].includes(e.type) ? '■ ' : '⚽ ') + esc(e.player || '?') + ' ' + esc(e.min) + (e.type==='pen'?' (p)':e.type==='og'?' (og)':'')).join(', ');
}
function row(m){
  if (m.kind === 'race') {
    const top = m.results.slice(0,3).map(r => `${esc(r.pos)}. ${esc(r.name)}`).join(' · ');
    return `<div class="m">${status(m)}<div class="t" style="grid-column:2/5">${esc(m.note)}${top ? ' — ' + top : ''}</div></div>`;
  }
  const pre = m.state === 'pre';
  const sc = pre ? '–' : (m.kind === 'duel' && m.home.ls.length ? m.home.ls.map((x,i)=>`${x}-${m.away.ls[i]}`).join(' ') : `${esc(m.home.score)} - ${esc(m.away.score)}`);
  const so = (m.home.so && (m.home.so !== '0' || m.away.so !== '0')) ? `<div class="st" style="text-align:center">(${esc(m.home.so)}-${esc(m.away.so)} p)</div>` : '';
  const e1 = evs(m,'h'), e2 = evs(m,'a');
  return `<div class="m">${status(m)}<div class="t h">${esc(m.home.short || m.home.name)}${reds(m.home.reds)}</div>
    <div class="sc">${sc}${so}</div><div class="t">${reds(m.away.reds)}${esc(m.away.short || m.away.name)}</div>
    ${(e1||e2) ? `<div class="ev"><div>${e1}</div><div>${e2}</div></div>` : ''}</div>`;
}
function groups(ms){
  const g = new Map();
  for (const m of ms){ if(!g.has(m.lname)) g.set(m.lname, []); g.get(m.lname).push(m); }
  return [...g].map(([l, list]) => `<section class="league"><h2>${esc(l)}</h2>${list.map(row).join('')}</section>`).join('');
}
async function render(){
  const main = document.getElementById('main');
  try {
    if (view === 'live' || view === 'today'){
      const d = await get('/api/live');
      let ms = d.matches;
      if (view === 'live') ms = ms.filter(m => m.state === 'in');
      ms.sort((a,b) => (a.state==='in'?0:1)-(b.state==='in'?0:1) || a.start-b.start);
      main.innerHTML = ms.length ? groups(ms) : `<div class="empty">${view==='live'?'No live matches right now.':'No matches today in the tracked competitions.'}</div>`;
    } else if (view === 'feed'){
      const d = await get('/api/events');
      main.innerHTML = d.length ? `<div class="feed">${d.map(e=>`<div><time>${hm(e.ts)}</time>${esc(e.text)}</div>`).join('')}</div>` : '<div class="empty">No events yet.</div>';
    } else if (view === 'porra'){
      const d = await get('/api/ranking' + (porraChan ? '?chan=' + encodeURIComponent(porraChan) : ''));
      const sel = `<p><select id="pc">${d.channels.map(c=>`<option ${c===d.chan?'selected':''}>${esc(c)}</option>`).join('')}</select></p>`;
      main.innerHTML = sel + (d.rows.length ? `<table><tr><th>#</th><th>Player</th><th class="n">Pts</th><th class="n">Exact</th><th class="n">Picks</th></tr>${d.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nick)}</td><td class="n"><b>${r.pts}</b></td><td class="n">${r.exact}</td><td class="n">${r.n}</td></tr>`).join('')}</table>` : '<div class="empty">No predictions settled yet.</div>');
      const pc = document.getElementById('pc'); if (pc) pc.onchange = () => { porraChan = pc.value; render(); };
    } else {
      const d = await get('/api/status');
      const up = d.uptime, upt = `${Math.floor(up/86400)}d ${Math.floor(up%86400/3600)}h ${Math.floor(up%3600/60)}m`;
      main.innerHTML = `<table><tr><th>Version</th><td>${esc(d.version)}</td></tr><tr><th>Uptime</th><td>${upt}</td></tr>
        <tr><th>Transport</th><td>${esc(d.transport)}</td></tr><tr><th>Requests</th><td>${d.requests} (${d.errors} errors, ${d.cachehits} cache hits)</td></tr>
        <tr><th>Narrations</th><td>${d.narrations}</td></tr></table><p></p>
        <table><tr><th>Competition</th><th class="n">Matches</th><th class="n">Next poll</th><th>State</th></tr>
        ${d.leagues.map(l=>`<tr><td>${esc(l.name)} <span class="st">${esc(l.league)}</span></td><td class="n">${l.matches}</td><td class="n">${l.next}s</td><td>${l.live?'<span class="st live">live</span>':(l.fails?'errors':'ok')}</td></tr>`).join('')}</table>`;
    }
    document.getElementById('upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    main.innerHTML = `<div class="empty">Cannot reach the bot (${esc(e.message)}).</div>`;
  }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  view = b.dataset.v; render();
});
render(); timer = setInterval(render, 15000);
</script>
</body>
</html>
